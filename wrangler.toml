name = "field-watch"
main = "worker/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "webapp/out"
binding = "ASSETS"

# Reuses the same D1 database and R2 bucket already set up in the
# Cloudflare dashboard for this project (schema.sql now defines
# projects/shots tables for cloud-shared projects).
[[d1_databases]]
binding = "DB"
database_name = "fieldwatch-db"
database_id = "3910c631-e87f-4112-9c96-29dd98304317"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "fieldwatch-photos"
