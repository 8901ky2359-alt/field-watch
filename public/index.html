<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>FieldWatch 施工管理</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f2f3f2;
  --panel:#ffffff;
  --ink:#111111;
  --ink-soft:#4a4a4a;
  --line:#111111;
  --line-soft:#c9cbc9;
  --grey:#e6e7e6;
  --green:#0d6b34;
  --green-dark:#08431f;
  --green-tint:#e6f3ea;
  --red:#c62828;
  --red-dark:#7a1414;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0!important;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  font-size:16px;
  line-height:1.5;
  padding-bottom:24px;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font-family:inherit;}
a{color:var(--green-dark);}
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--ink);color:#fff;
  padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:3px solid var(--green);
}
.topbar .brand{font-size:18px;font-weight:800;letter-spacing:.02em;}
.topbar .brand small{display:block;font-size:11px;font-weight:600;color:#b7e2c6;letter-spacing:.05em;}
.view-mode-flag{background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border:2px solid var(--red-dark);}
.topbar-right{display:flex;align-items:center;gap:10px;}

.menu-toggle{
  background:none;border:2px solid #fff;color:#fff;
  width:40px;height:40px;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  cursor:pointer;flex-shrink:0;
}
.menu-toggle span{display:block;width:20px;height:2px;background:#fff;}

.mobile-menu{
  position:absolute;top:100%;right:0;z-index:60;
  width:220px;background:#fff;border:3px solid var(--ink);border-top:none;
  display:none;
}
.mobile-menu.open{display:block;}
.mobile-menu button{
  display:block;width:100%;text-align:left;background:#fff;border:none;border-bottom:2px solid var(--line-soft);
  padding:14px 16px;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;
}
.mobile-menu button:last-child{border-bottom:none;}
.mobile-menu button.active{background:var(--green);color:#fff;}
main{max-width:720px;margin:0 auto;padding:16px;}
.screen{display:none;}
.screen.active{display:block;}

.section-title{font-size:14px;font-weight:800;color:var(--ink-soft);margin:20px 0 8px;letter-spacing:.03em;text-transform:uppercase;}
.section-title:first-child{margin-top:0;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:12px 16px;
  border:2px solid var(--ink);background:#fff;color:var(--ink);
  font-size:16px;font-weight:800;cursor:pointer;line-height:1.2;
  text-decoration:none;
}
.btn:active{transform:translateY(1px);}
.btn-block{width:100%;}
.btn-primary{background:var(--green);color:#fff;border-color:var(--green-dark);}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red-dark);}
.btn-outline{background:#fff;color:var(--ink);}
.btn-sm{min-height:38px;padding:6px 12px;font-size:13px;}
.btn[disabled]{opacity:.4;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}
.btn-row .btn{flex:1;}

.stat-row{display:flex;gap:10px;margin-top:12px;}
.stat-box{flex:1;background:var(--panel);border:2px solid var(--ink);padding:12px 10px;text-align:center;}
.stat-box .num{font-size:26px;font-weight:900;line-height:1;}
.stat-box .label{font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:6px;}
.stat-box.red .num{color:var(--red);}
.stat-box.green .num{color:var(--green);}

.card{background:var(--panel);border:2px solid var(--ink);padding:14px;margin-bottom:12px;}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
.card-title{font-size:17px;font-weight:800;}
.card-meta{font-size:13px;color:var(--ink-soft);margin-bottom:4px;}
.card-meta b{color:var(--ink);font-weight:700;}
.chips-inline{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
.tag{font-size:12px;font-weight:700;border:2px solid var(--ink);padding:3px 8px;background:#fff;}

.status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:2px solid;font-size:12px;font-weight:800;white-space:nowrap;}
.status-badge::before{content:'';width:8px;height:8px;background:#fff;display:inline-block;}
.status-badge.in_progress{color:#fff;background:var(--red);border-color:var(--red-dark);}
.status-badge.completed{color:#fff;background:var(--green);border-color:var(--green-dark);}

.progress{height:12px;background:var(--grey);border:2px solid var(--ink);margin:8px 0;}
.progress > i{display:block;height:100%;background:var(--green);}
.progress-label{font-size:12px;font-weight:700;color:var(--ink-soft);}

.empty-note{padding:20px;text-align:center;color:var(--ink-soft);font-size:14px;border:2px dashed var(--line-soft);}

/* ---- form ---- */
.field{margin-bottom:16px;}
.field label.field-label{display:block;font-size:13px;font-weight:800;margin-bottom:6px;}
.field .hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
.field input[type=text],
.field input[type=number],
.field input[type=date],
.field input[type=url],
.field select,
.field textarea{
  width:100%;min-height:48px;border:2px solid var(--ink);padding:10px 12px;
  font-size:16px;background:#fff;color:var(--ink);
}
.field textarea{min-height:96px;resize:vertical;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}

.mode-toggle{display:flex;border:2px solid var(--ink);margin-bottom:12px;}
.mode-toggle button{flex:1;min-height:46px;background:#fff;border:none;border-right:2px solid var(--ink);font-weight:800;font-size:14px;color:var(--ink-soft);cursor:pointer;}
.mode-toggle button:last-child{border-right:none;}
.mode-toggle button.active{background:var(--green);color:#fff;}

.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);padding:9px 14px;font-size:14px;font-weight:700;background:#fff;cursor:pointer;}
.chip.selected{background:var(--green);color:#fff;border-color:var(--green-dark);}
.chip-list{display:flex;flex-wrap:wrap;gap:8px;}
.selected-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;padding:6px 6px 6px 12px;font-size:13px;font-weight:700;}
.pill button{background:var(--red);color:#fff;border:none;width:22px;height:22px;font-weight:900;cursor:pointer;font-size:13px;line-height:1;}
.add-inline{display:flex;gap:8px;margin-top:10px;}
.add-inline input{flex:1;}

.map-status-inline{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.map-status-inline .ok{color:var(--green-dark);font-weight:700;font-size:13px;}
.map-status-inline .ng{color:var(--red-dark);font-weight:700;font-size:13px;}

/* ---- photo grid ---- */
.pair-row{border:2px solid var(--ink);margin-bottom:14px;}
.pair-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--grey);border-bottom:2px solid var(--ink);font-weight:800;font-size:14px;}
.pair-body{display:flex;}
.photo-slot{flex:1;min-width:0;border-right:2px solid var(--ink);display:flex;flex-direction:column;}
.photo-slot:last-child{border-right:none;}
.slot-label{font-size:12px;font-weight:800;text-align:center;padding:6px 0;background:#fafafa;border-bottom:2px solid var(--ink);}
.slot-label.before{color:var(--ink-soft);}
.slot-label.after{color:var(--green-dark);}
.slot-img-wrap{position:relative;aspect-ratio:5/4;background:#eee;overflow:hidden;}
.slot-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.slot-empty{aspect-ratio:5/4;display:flex;align-items:center;justify-content:center;background:#ececec;color:#8a8a8a;font-size:12px;font-weight:700;text-align:center;padding:8px;}
.slot-actions{display:flex;flex-direction:column;}
.slot-actions-row{display:flex;border-top:2px solid var(--ink);}
.slot-actions-row label,.slot-actions-row .del{flex:1;text-align:center;padding:9px 4px;font-size:12px;font-weight:800;border-right:1px solid var(--ink);cursor:pointer;background:#fff;color:var(--ink);}
.slot-actions-row label:last-child,.slot-actions-row .del:last-child{border-right:none;}
.slot-actions-row input[type=file]{display:none;}
.slot-actions-row .del{background:#fff;color:var(--red-dark);}

.bulk-photo-actions{background:var(--panel);border:2px solid var(--ink);padding:12px;margin-bottom:14px;}
.bulk-review-panel{background:var(--panel);border:2px solid var(--ink);padding:12px;margin-bottom:14px;}
.bulk-review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.bulk-review-item{border:2px solid var(--ink);}
.bulk-review-item img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}
.bulk-review-item .bri-toggle{display:flex;border-top:2px solid var(--ink);}
.bulk-review-item .bri-toggle button{flex:1;border:none;background:#fff;padding:6px 2px;font-size:11px;font-weight:800;color:var(--ink-soft);cursor:pointer;border-right:1px solid var(--ink);}
.bulk-review-item .bri-toggle button:last-child{border-right:none;}
.bulk-review-item .bri-toggle button.active{background:var(--green);color:#fff;}
.bulk-review-item .bri-toggle button.active[data-side="after"]{background:var(--green-dark);}

.save-bar{background:var(--bg);padding:12px 0 4px;margin-top:8px;}
.savebar-msg{font-size:13px;font-weight:700;text-align:center;margin-top:8px;min-height:18px;}
.savebar-msg.ok{color:var(--green-dark);}
.savebar-msg.err{color:var(--red-dark);}

/* ---- list screen ---- */
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
#mapview{height:420px;border:2px solid var(--ink);margin-bottom:16px;}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{border-radius:0!important;}
.map-popup{font-size:13px;}
.map-popup .mp-title{font-weight:800;font-size:14px;margin:6px 0 4px;}
.map-popup .mp-addr{color:var(--ink-soft);margin-bottom:8px;}

/* ---- detail screen ---- */
.detail-header{margin-bottom:6px;}
.detail-header h1{font-size:20px;font-weight:900;margin-bottom:6px;}
.info-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;margin:14px 0;}
.info-grid dt{font-weight:800;color:var(--ink-soft);white-space:nowrap;}
.info-grid dd{color:var(--ink);}
.notes-box{background:var(--panel);border:2px solid var(--ink);padding:12px;white-space:pre-wrap;font-size:14px;margin:10px 0 16px;}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 16px;font-size:13px;font-weight:700;
  border:2px solid #000;z-index:100;max-width:90vw;text-align:center;display:none;
}
.toast.show{display:block;}
.toast.err{background:var(--red-dark);}

/* ---- desktop 3-pane layout (menu / map / detail) ---- */
.desktop-sidebar,.desktop-map-pane{display:none;}
#desktopMap{width:100%;height:100%;}

@media(min-width:960px){
  html,body{height:100%;overflow:hidden;}
  body{
    display:grid;
    grid-template-columns:240px 1fr 460px;
    padding-bottom:0;
  }
  .menu-toggle,.mobile-menu{display:none;}

  .desktop-sidebar{
    display:flex;flex-direction:column;
    grid-column:1;height:100%;overflow-y:auto;
    background:var(--ink);color:#fff;border-right:3px solid var(--green);
  }
  .desktop-sidebar .ds-brand{padding:16px;border-bottom:1px solid #333;}
  .desktop-sidebar .ds-brand b{display:block;font-size:17px;font-weight:800;}
  .desktop-sidebar .ds-brand small{display:block;font-size:11px;color:#b7e2c6;margin-top:2px;letter-spacing:.05em;}
  .ds-link{
    display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid #2a2a2a;
    color:#e6e7e6;font-size:15px;font-weight:700;padding:14px 16px;cursor:pointer;
  }
  .ds-link.active{background:var(--green);color:#fff;}
  .ds-stats{padding:16px;border-top:1px solid #333;margin-top:auto;}
  .ds-stats .ds-stat{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#cfd2cf;padding:4px 0;}
  .ds-stats .ds-stat b{color:#fff;}

  .desktop-map-pane{display:block;grid-column:2;height:100%;border-right:3px solid var(--ink);}

  .mobile-shell{grid-column:3;height:100%;display:flex;flex-direction:column;overflow:hidden;}
  #screens{flex:1;overflow-y:auto;}
  main{max-width:none;margin:0;}
}
</style>
</head>
<body>

<aside class="desktop-sidebar">
  <div class="ds-brand"><b>FieldWatch</b><small>施工記録管理</small></div>
  <button class="ds-link" data-action="nav" data-target="home">ホーム</button>
  <button class="ds-link" data-action="nav" data-target="record">記録する</button>
  <button class="ds-link" data-action="nav" data-target="list">一覧</button>
  <div class="ds-stats" id="desktopStats"></div>
</aside>
<div class="desktop-map-pane"><div id="desktopMap"></div></div>

<div class="mobile-shell">
<header class="topbar">
  <div class="brand">FieldWatch<small>施工記録管理</small></div>
  <div class="topbar-right">
    <span id="viewModeFlag" class="view-mode-flag" style="display:none;">閲覧モード</span>
    <button type="button" class="menu-toggle" id="menuToggle" aria-label="メニュー"><span></span><span></span><span></span></button>
  </div>
  <nav class="mobile-menu" id="mobileMenu">
    <button data-action="nav" data-target="home">ホーム</button>
    <button data-action="nav" data-target="record">記録する</button>
    <button data-action="nav" data-target="list">一覧</button>
  </nav>
</header>

<main id="screens">

  <!-- HOME -->
  <section id="screen-home" class="screen">
    <div class="btn-row">
      <button class="btn btn-primary btn-block" data-action="nav" data-target="record">記録する</button>
      <button class="btn btn-outline btn-block" data-action="nav" data-target="list">一覧</button>
    </div>

    <div class="stat-row" id="homeStats"></div>

    <div class="section-title">施工中の現場</div>
    <div id="homeInProgressList"></div>
  </section>

  <!-- RECORD -->
  <section id="screen-record" class="screen">
    <div class="section-title" id="recordScreenTitle">新規現場の記録</div>
    <form id="siteForm">
      <div class="field">
        <label class="field-label">現場名 <span style="color:var(--red)">*</span></label>
        <input type="text" id="fName" placeholder="例）大崎第一太陽光発電所" required>
      </div>

      <div class="field">
        <label class="field-label">Googleマップの共有URL または 緯度,経度</label>
        <input type="text" id="fMapUrl" placeholder="https://maps.app.goo.gl/... または 35.01,136.76">
        <div class="btn-row" style="margin-top:8px;">
          <button type="button" class="btn btn-outline btn-sm" data-action="resolve-map">位置情報を取得</button>
        </div>
        <div class="map-status-inline" id="mapResolveStatus"></div>
      </div>

      <div class="field">
        <label class="field-label">所在地（住所・目印）</label>
        <input type="text" id="fAddress" placeholder="例）三重県津市大崎町123">
      </div>

      <div class="field">
        <label class="field-label">作業日</label>
        <div class="mode-toggle">
          <button type="button" data-action="set-date-mode" data-mode="range" id="dmRange">期間指定</button>
          <button type="button" data-action="set-date-mode" data-mode="days" id="dmDays">実績日を個別指定</button>
        </div>

        <div id="dateModeRange">
          <div class="field-row">
            <div class="field"><label class="field-label">開始日</label><input type="date" id="fStartDate"></div>
            <div class="field"><label class="field-label">終了日</label><input type="date" id="fEndDate"></div>
          </div>
        </div>

        <div id="dateModeDays" style="display:none;">
          <div class="add-inline">
            <input type="date" id="fNewWorkDay">
            <button type="button" class="btn btn-outline btn-sm" data-action="add-workday">追加</button>
          </div>
          <div class="selected-list" id="workDaysList"></div>
        </div>
      </div>

      <div class="field">
        <label class="field-label">作業内容</label>
        <div class="chip-list" id="workTypePresets"></div>
        <div class="add-inline">
          <input type="text" id="fCustomWorkType" placeholder="自由入力で追加">
          <button type="button" class="btn btn-outline btn-sm" data-action="add-custom-worktype">追加</button>
        </div>
        <div class="selected-list" id="workTypesList"></div>
      </div>

      <div class="field">
        <label class="field-label">撮影箇所数（1〜50）</label>
        <input type="number" id="fPairCount" min="1" max="50" value="1">
        <div class="hint">Before/After を1組として、現場内の撮影ポイント数を指定します。</div>
      </div>

      <div class="field">
        <label class="field-label">メモ</label>
        <textarea id="fNotes" placeholder="申し送り事項など"></textarea>
      </div>

      <div class="field" id="currentStatusField" style="display:none;">
        <label class="field-label">現在のステータス</label>
        <span id="currentStatusBadge"></span>
      </div>

      <div class="save-bar">
        <button type="submit" class="btn btn-primary btn-block" id="saveSiteBtn">この内容で保存する</button>
        <div class="savebar-msg" id="saveMsg"></div>
      </div>
    </form>

    <div class="section-title">ビフォーアフター写真</div>
    <div id="bulkPhotoActions" class="bulk-photo-actions" style="display:none;">
      <div class="hint">まとめて登録：Before/Afterを分けて選ぶか、混在のまま選んで後から振り分けられます</div>
      <div class="btn-row" style="margin-top:8px;">
        <button type="button" class="btn btn-outline btn-sm" data-action="bulk-pick" data-mode="separate-before">Beforeをまとめて選択</button>
        <button type="button" class="btn btn-outline btn-sm" data-action="bulk-pick" data-mode="separate-after">Afterをまとめて選択</button>
      </div>
      <div class="btn-row" style="margin-top:8px;">
        <button type="button" class="btn btn-primary btn-sm" data-action="bulk-pick" data-mode="mixed">まとめて報告（Before/After混在でOK）</button>
      </div>
      <input type="file" id="bulkFileInput" accept="image/*" multiple style="display:none;">
    </div>

    <div id="bulkReviewPanel" class="bulk-review-panel" style="display:none;">
      <div class="section-title">アップロード内容の確認（タップでBefore/After切り替え）</div>
      <div id="bulkReviewGrid" class="bulk-review-grid"></div>
      <div class="btn-row" style="margin-top:8px;">
        <button type="button" class="btn btn-primary" data-action="bulk-confirm">この内容でアップロード</button>
        <button type="button" class="btn btn-outline" data-action="bulk-cancel">キャンセル</button>
      </div>
    </div>

    <div id="photoGridWrap">
      <div class="empty-note">先に現場情報を保存すると、撮影・アップロードができるようになります。</div>
    </div>
  </section>

  <!-- LIST -->
  <section id="screen-list" class="screen">
    <div class="mode-toggle">
      <button type="button" data-action="set-list-mode" data-mode="list" id="lmList">リスト表示</button>
      <button type="button" data-action="set-list-mode" data-mode="map" id="lmMap">地図表示</button>
    </div>
    <div class="filter-row">
      <button class="chip selected" data-action="set-filter" data-filter="all">すべて</button>
      <button class="chip" data-action="set-filter" data-filter="in_progress">施工中</button>
      <button class="chip" data-action="set-filter" data-filter="completed">施工完了</button>
    </div>

    <div id="mapview" style="display:none;"></div>
    <div id="listContainer"></div>
  </section>

  <!-- DETAIL -->
  <section id="screen-detail" class="screen">
    <div id="detailContent"></div>
  </section>

</main>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
"use strict";

var WORK_TYPE_PRESETS = ['除草作業','整線作業','アース線設置','運搬','パネル設置'];

var state = {
  sites: [],
  sitesLoaded: false,
  editing: null,     // current record-screen form state
  listMode: 'list',
  listFilter: 'all',
  map: null,
  mapMarkers: [],
  desktopMap: null,
  desktopMapMarkers: [],
  bulkMode: null,
  bulkFiles: null
};

// ---------------- API ----------------
function apiGet(url){
  return fetch(url).then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.message || d.error || 'error'); return d; }); });
}
function apiSend(url, method, body){
  return fetch(url,{method:method, headers:{'content-type':'application/json'}, body: JSON.stringify(body)})
    .then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.message || d.error || 'error'); return d; }); });
}
function apiUpload(url, formData){
  return fetch(url,{method:'POST', body: formData})
    .then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.message || d.error || 'error'); return d; }); });
}
function apiDelete(url){
  return fetch(url,{method:'DELETE'})
    .then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.message || d.error || 'error'); return d; }); });
}

function loadSites(force){
  if(state.sitesLoaded && !force){
    safeRenderDesktopPanes();
    return Promise.resolve(state.sites);
  }
  return apiGet('/api/sites').then(function(d){
    state.sites = d.sites;
    state.sitesLoaded = true;
    safeRenderDesktopPanes();
    return state.sites;
  });
}
function safeRenderDesktopPanes(){
  // Desktop sidebar/map are a progressive-enhancement layer; a failure here
  // (e.g. the map tile CDN being unreachable) must never break the primary
  // mobile screen flow that called loadSites().
  try { renderDesktopMap(); } catch(e){ /* ignore */ }
  try { renderDesktopStats(); } catch(e){ /* ignore */ }
}

// ---------------- helpers ----------------
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtShort(d){
  if(!d) return '?';
  var p = d.split('-');
  return p.length===3 ? (p[1]+'/'+p[2]) : d;
}
function formatWorkDate(site){
  if(site.dateMode==='days'){
    if(!site.workDays || !site.workDays.length) return '未設定';
    var sorted = site.workDays.slice().sort();
    return sorted.map(fmtShort).join('、');
  }
  if(!site.startDate && !site.endDate) return '未設定';
  var s = fmtShort(site.startDate), e = fmtShort(site.endDate);
  return s===e ? s : (s+'〜'+e);
}
function statusLabel(s){ return s==='completed' ? '施工完了' : '施工中'; }
function imgUrl(key){ return '/api/image?key=' + encodeURIComponent(key); }
function daysSince(dateStr){
  if(!dateStr) return null;
  var iso = dateStr;
  if(/^\d{4}-\d{2}-\d{2}$/.test(iso)){
    iso += 'T00:00:00Z';
  } else {
    if(iso.indexOf('T')===-1) iso = iso.replace(' ', 'T');
    if(!/[Zz]|[+-]\d\d:?\d\d$/.test(iso)) iso += 'Z';
  }
  var then = new Date(iso);
  if(isNaN(then.getTime())) return null;
  return Math.max(0, Math.floor((Date.now() - then.getTime()) / 86400000));
}
function completionReferenceDate(site){
  if(site.dateMode==='days'){
    if(!site.workDays || !site.workDays.length) return null;
    return site.workDays.slice().sort().pop();
  }
  return site.endDate || site.startDate || null;
}
function siteMarkerIcon(s){
  var color = s.status==='completed' ? '#1a56db' : '#c62828';
  var label = '';
  if(s.status==='completed'){
    var days = daysSince(completionReferenceDate(s));
    if(days!=null){
      label = '<div style="background:#111;color:#fff;font-size:10px;font-weight:800;padding:1px 5px;margin-top:2px;white-space:nowrap;border:1px solid #fff;">'+days+'日経過</div>';
    }
  }
  return L.divIcon({
    className: '',
    html: '<div style="display:flex;flex-direction:column;align-items:center;">' +
      '<div style="width:20px;height:20px;background:'+color+';border:2px solid #111;flex-shrink:0;"></div>' +
      label +
    '</div>',
    iconSize: [70, 40],
    iconAnchor: [35, 10]
  });
}
function toast(msg, isErr){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr?' err':'');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.className='toast'; }, 2600);
}

// ---------------- router ----------------
function currentRoute(){
  var hash = location.hash.replace(/^#\/?/, '');
  var parts = hash.split('/').filter(Boolean);
  return parts;
}
function navigate(path){ location.hash = path; }

function showScreen(name){
  document.querySelectorAll('.screen').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('[data-action="nav"]').forEach(function(el){
    el.classList.toggle('active', el.dataset.target === name);
  });
  document.getElementById('viewModeFlag').style.display = 'none';
  document.getElementById('mobileMenu').classList.remove('open');
  window.scrollTo(0,0);
  var screensEl = document.getElementById('screens');
  if(screensEl) screensEl.scrollTo(0,0);
}

function route(){
  var parts = currentRoute();
  if(parts[0]==='record'){ showScreen('record'); initRecordScreen(parts[1]||null); }
  else if(parts[0]==='list'){ showScreen('list'); initListScreen(); }
  else if(parts[0]==='detail'){ showScreen('detail'); initDetailScreen(parts[1], parts[2]==='view'); }
  else { showScreen('home'); initHomeScreen(); }
}
window.addEventListener('hashchange', route);

}

  var sites = state.sites;

  var completed = sites.filter(function(s){ return s.status==='completed'; });

  document.getElementById('homeStats').innerHTML =
    '<div class="stat-box"><div class="num">'+total+'</div><div class="label">登録現場数</div></div>' +

    listEl.innerHTML = '<div class="empty-note">施工中の現場はありません</div>';
    return;

// ---------------- LIST ----------------
function initListScreen(){
  loadSites(true).then(renderList).catch(function(e){ toast('読み込みに失敗しました: '+e.message, true); });
  document.getElementById('lmList').classList.toggle('active', state.listMode==='list');
  document.getElementById('lmMap').classList.toggle('active', state.listMode==='map');
  document.querySelectorAll('.filter-row .chip').forEach(function(c){
    c.classList.toggle('selected', c.dataset.filter===state.listFilter);
  });
}
function filteredSites(){
  if(state.listFilter==='all') return state.sites;
  return state.sites.filter(function(s){ return s.status===state.listFilter; });
}
function renderList(){
  document.getElementById('mapview').style.display = state.listMode==='map' ? 'block' : 'none';
  document.getElementById('listContainer').style.display = state.listMode==='map' ? 'none' : 'block';
  if(state.listMode==='map'){ renderMap(); return; }

  var sites = filteredSites();
  var el = document.getElementById('listContainer');
  if(!sites.length){ el.innerHTML = '<div class="empty-note">該当する現場がありません</div>'; return; }

  el.innerHTML = sites.map(function(s){
    var pct = s.pairCount ? Math.round(s.completedPairs / s.pairCount * 100) : 0;
    var typesHtml = (s.workTypes||[]).map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join('');
    var resumeBtn = s.status==='in_progress'
      ? '<button class="btn btn-primary btn-sm" data-action="goto-record" data-id="'+s.id+'">続きから記録</button>'
      : '';
    return '' +
      '<div class="card">' +
        '<div class="card-head">' +
          '<div class="card-title">'+esc(s.name)+'</div>' +
          '<span class="status-badge '+s.status+'">'+statusLabel(s.status)+'</span>' +
        '</div>' +
        '<div class="card-meta">'+esc(s.address||'所在地未設定')+'</div>' +
        '<div class="card-meta">作業日：'+esc(formatWorkDate(s))+'</div>' +
        '<div class="chips-inline">'+typesHtml+'</div>' +
        '<div class="progress"><i style="width:'+pct+'%"></i></div>' +
        '<div class="progress-label">撮影済みペア '+s.completedPairs+' / '+s.pairCount+'</div>' +
        '<div class="btn-row" style="margin-top:10px;">' +
          resumeBtn +
          '<button class="btn btn-outline btn-sm" data-action="goto-detail" data-id="'+s.id+'">詳細を見る</button>' +
        '</div>' +
      '</div>';
  }).join('');
}
function renderMap(){
  var el = document.getElementById('mapview');
  if(!state.map){
    state.map = L.map(el).setView([35.68, 138.5], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(state.map);
  } else {
    state.map.invalidateSize();
  }
  state.mapMarkers.forEach(function(m){ state.map.removeLayer(m); });
  state.mapMarkers = [];

  var sites = filteredSites().filter(function(s){ return typeof s.lat==='number' && typeof s.lng==='number'; });
  if(!sites.length) return;

  var bounds = [];
  sites.forEach(function(s){
    var icon = siteMarkerIcon(s);
    var marker = L.marker([s.lat, s.lng], { icon: icon }).addTo(state.map);
    marker.bindPopup(
      '<div class="map-popup">' +
        '<span class="status-badge '+s.status+'">'+statusLabel(s.status)+'</span>' +
        '<div class="mp-title">'+esc(s.name)+'</div>' +
        '<div class="mp-addr">'+esc(s.address||'')+'</div>' +
        '<button class="btn btn-primary btn-sm" data-action="goto-detail" data-id="'+s.id+'">現場ページを見る</button>' +
      '</div>'
    );
    state.mapMarkers.push(marker);
    bounds.push([s.lat, s.lng]);
  });
  if(bounds.length===1){ state.map.setView(bounds[0], 14); }
  else { state.map.fitBounds(bounds, { padding: [30,30] }); }
}

// ---------------- RECORD ----------------
function blankForm(){
  return {
    id: null,
    name: '', mapUrl: '', lat: null, lng: null, address: '',
    dateMode: 'range', startDate: '', endDate: '', workDays: [],
    workTypes: [], notes: '', pairCount: 1, status: 'in_progress',
    pairs: []
  };
}
function initRecordScreen(id){
  loadSites();
  document.getElementById('saveMsg').textContent = '';
  document.getElementById('mapResolveStatus').innerHTML = '';
  clearBulkReview();
  if(!id){
    state.editing = blankForm();
    document.getElementById('recordScreenTitle').textContent = '新規現場の記録';
    fillForm(state.editing);
    renderPhotoGrid();
    return;
  }
  document.getElementById('recordScreenTitle').textContent = '現場情報を編集';
  apiGet('/api/sites/'+id).then(function(d){
    state.editing = d.site;
    fillForm(state.editing);
    renderPhotoGrid();
  }).catch(function(e){ toast('現場情報の取得に失敗しました: '+e.message, true); });
}
function fillForm(s){
  document.getElementById('fName').value = s.name || '';
  document.getElementById('fMapUrl').value = s.mapUrl || '';
  document.getElementById('fAddress').value = s.address || '';
  document.getElementById('fStartDate').value = s.startDate || '';
  document.getElementById('fEndDate').value = s.endDate || '';
  document.getElementById('fPairCount').value = s.pairCount || 1;
  document.getElementById('fNotes').value = s.notes || '';
  setDateMode(s.dateMode || 'range', true);
  renderWorkDaysList();
  renderWorkTypePresets();
  renderWorkTypesList();

  var statusField = document.getElementById('currentStatusField');
  if(s.id){
    statusField.style.display = 'block';
    document.getElementById('currentStatusBadge').innerHTML =
      '<span class="status-badge '+s.status+'">'+statusLabel(s.status)+'</span>';
  } else {
    statusField.style.display = 'none';
  }
  if(s.lat!=null && s.lng!=null){
    document.getElementById('mapResolveStatus').innerHTML =
      '<span class="ok">位置情報取得済み（'+s.lat.toFixed(5)+', '+s.lng.toFixed(5)+'）</span>';
  }
}

  document.getElementById('dmRange').classList.toggle('active', mode==='range');
  document.getElementById('dmDays').classList.toggle('active', mode==='days');
  document.getElementById('dateModeRange').style.display = mode==='range' ? 'block' : 'none';

function renderPhotoGrid(){
  var wrap = document.getElementById('photoGridWrap');
  var s = state.editing;
  var bulkActions = document.getElementById('bulkPhotoActions');
  if(!s.id){
    wrap.innerHTML = '<div class="empty-note">先に現場情報を保存すると、撮影・アップロードができるようになります。</div>';
    bulkActions.style.display = 'none';
    return;
  }
  bulkActions.style.display = 'block';
  var pairs = s.pairs && s.pairs.length ? s.pairs : buildEmptyPairs(s.pairCount);
  wrap.innerHTML = pairs.map(function(p){
    return '' +
      '<div class="pair-row">' +
        '<div class="pair-head"><span>撮影箇所 '+String(p.index).padStart(2,'0')+'</span></div>' +
        '<div class="pair-body">' +
          photoSlotHtml(s.id, p.index, 'before', p.before) +
          photoSlotHtml(s.id, p.index, 'after', p.after) +
        '</div>' +
      '</div>';
  }).join('');
}
function buildEmptyPairs(count){
  var arr = [];
  for(var i=1;i<=count;i++) arr.push({ index:i, before:null, after:null });
  return arr;
}
function photoSlotHtml(siteId, pairIndex, side, photo){
  var label = side==='before' ? 'Before' : 'After';
  var inputId = 'file-'+siteId+'-'+pairIndex+'-'+side;
  var previewHtml = photo
    ? '<div class="slot-img-wrap"><img src="'+imgUrl(photo.objectKey)+'" alt=""></div>'
    : '<div class="slot-empty">未撮影</div>';
  var deleteRow = photo
    ? '<div class="slot-actions-row"><span class="del" data-action="delete-photo" data-pair="'+pairIndex+'" data-side="'+side+'">削除</span></div>'
    : '';
  return '' +
    '<div class="photo-slot">' +
      '<div class="slot-label '+side+'">'+label+'</div>' +
      previewHtml +
      '<div class="slot-actions">' +
        '<div class="slot-actions-row">' +
          '<label for="'+inputId+'-cam">撮影<input type="file" accept="image/*" capture="environment" id="'+inputId+'-cam" onchange="fwHandlePhotoFile(this,\''+siteId+'\','+pairIndex+',\''+side+'\')"></label>' +
          '<label for="'+inputId+'-lib">アップ<input type="file" accept="image/*" id="'+inputId+'-lib" onchange="fwHandlePhotoFile(this,\''+siteId+'\','+pairIndex+',\''+side+'\')"></label>' +
        '</div>' +
        deleteRow +
      '</div>' +
    '</div>';
}
function uploadOnePhoto(siteId, pairIndex, side, file){
  var fd = new FormData();
  fd.append('pairIndex', String(pairIndex));
  fd.append('side', side);
  fd.append('file', file);
  return apiUpload('/api/sites/'+siteId+'/photo', fd);
}
window.fwHandlePhotoFile = function(inputEl, siteId, pairIndex, side){
  var file = inputEl.files && inputEl.files[0];
  if(!file) return;
  toast('アップロード中...');
  uploadOnePhoto(siteId, pairIndex, side, file).then(function(d){
    state.editing = d.site;
    renderPhotoGrid();
    toast('写真を保存しました');
  }).catch(function(e){ toast('アップロードに失敗しました: '+e.message, true); });
};

// ---------------- bulk photo upload ----------------
function bulkUploadSequential(files, side){
  var siteId = state.editing.id;
  var pairCount = state.editing.pairCount;
  var toUpload = files.slice(0, pairCount);
  var overflow = files.length - toUpload.length;
  var uploaded = 0;

  function next(i){
    if(i >= toUpload.length){
      state.sitesLoaded = false;
      renderPhotoGrid();
      var msg = uploaded + '件アップロードしました';
      if(overflow > 0) msg += '（撮影箇所数を超えた ' + overflow + '件は登録されませんでした）';
      toast(msg, overflow > 0);
      return;
    }
    toast('アップロード中... (' + (i+1) + '/' + toUpload.length + ')');
    uploadOnePhoto(siteId, i + 1, side, toUpload[i]).then(function(d){
      state.editing = d.site;
      uploaded++;
      next(i + 1);
    }).catch(function(e){
      toast('アップロードに失敗しました(' + (i+1) + '件目): ' + e.message, true);
    });
  }
  next(0);
}

function renderBulkReview(){
  var panel = document.getElementById('bulkReviewPanel');
  var grid = document.getElementById('bulkReviewGrid');
  if(!state.bulkFiles || !state.bulkFiles.length){ panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  grid.innerHTML = state.bulkFiles.map(function(item, i){
    return '' +
      '<div class="bulk-review-item">' +
        '<img src="'+item.url+'" alt="">' +
        '<div class="bri-toggle">' +
          '<button type="button" data-action="bulk-toggle-side" data-index="'+i+'" data-side="before" class="'+(item.side==='before'?'active':'')+'">Before</button>' +
          '<button type="button" data-action="bulk-toggle-side" data-index="'+i+'" data-side="after" class="'+(item.side==='after'?'active':'')+'">After</button>' +
        '</div>' +
      '</div>';
  }).join('');
}
function clearBulkReview(){
  (state.bulkFiles || []).forEach(function(item){ URL.revokeObjectURL(item.url); });
  state.bulkFiles = null;
  renderBulkReview();
}
function confirmBulkReview(){
  var siteId = state.editing.id;
  var pairCount = state.editing.pairCount;
  var befores = state.bulkFiles.filter(function(it){ return it.side==='before'; }).map(function(it){ return it.file; });
  var afters = state.bulkFiles.filter(function(it){ return it.side==='after'; }).map(function(it){ return it.file; });
  var beforeToUpload = befores.slice(0, pairCount);
  var afterToUpload = afters.slice(0, pairCount);
  var overflow = (befores.length - beforeToUpload.length) + (afters.length - afterToUpload.length);
  var jobs = beforeToUpload.map(function(f, i){ return { pairIndex: i+1, side: 'before', file: f }; })
    .concat(afterToUpload.map(function(f, i){ return { pairIndex: i+1, side: 'after', file: f }; }));
  var uploaded = 0;

  function next(i){
    if(i >= jobs.length){
      clearBulkReview();
      state.sitesLoaded = false;
      renderPhotoGrid();
      var msg = uploaded + '件アップロードしました';
      if(overflow > 0) msg += '（撮影箇所数を超えた ' + overflow + '件は登録されませんでした）';
      toast(msg, overflow > 0);
      return;
    }
    toast('アップロード中... (' + (i+1) + '/' + jobs.length + ')');
    var j = jobs[i];
    uploadOnePhoto(siteId, j.pairIndex, j.side, j.file).then(function(d){
      state.editing = d.site;
      uploaded++;
      next(i + 1);
    }).catch(function(e){
      toast('アップロードに失敗しました(' + (i+1) + '件目): ' + e.message, true);
    });
  }
  next(0);
}

function collectFormPayload(){
  return {
    name: document.getElementById('fName').value.trim(),
    mapUrl: document.getElementById('fMapUrl').value.trim(),
    lat: state.editing.lat,
    lng: state.editing.lng,
    address: document.getElementById('fAddress').value.trim(),
    dateMode: state.editing.dateMode,
    startDate: document.getElementById('fStartDate').value,
    endDate: document.getElementById('fEndDate').value,
    workDays: state.editing.workDays,
    workTypes: state.editing.workTypes,
    notes: document.getElementById('fNotes').value,
    pairCount: parseInt(document.getElementById('fPairCount').value, 10) || 1
  };
}
function saveSiteForm(){
  var payload = collectFormPayload();
  if(!payload.name){ toast('現場名を入力してください', true); return; }
  var msgEl = document.getElementById('saveMsg');
  msgEl.textContent = '保存中...'; msgEl.className = 'savebar-msg';

  var req = state.editing.id
    ? apiSend('/api/sites/'+state.editing.id, 'PATCH', payload)
    : apiSend('/api/sites', 'POST', payload);

  req.then(function(d){
    state.sitesLoaded = false;
    if(!state.editing.id){
      toast('現場情報を保存しました');
      navigate('/record/' + d.site.id);
    } else {
      msgEl.textContent = '保存しました'; msgEl.className = 'savebar-msg ok';
      state.editing = d.site;
      fillForm(state.editing);
      renderPhotoGrid();
    }
  }).catch(function(e){
    msgEl.textContent = '保存に失敗しました: '+e.message; msgEl.className = 'savebar-msg err';
  });
}

// ---------------- DETAIL ----------------
function initDetailScreen(id, viewMode){
  loadSites();
  document.getElementById('viewModeFlag').style.display = viewMode ? 'inline-block' : 'none';
  document.getElementById('detailContent').innerHTML = '';
  apiGet('/api/sites/'+id).then(function(d){
    renderDetail(d.site, viewMode);
  }).catch(function(e){
    document.getElementById('detailContent').innerHTML = '<div class="empty-note">現場が見つかりませんでした</div>';
  });
}
function renderDetail(s, viewMode){
  var typesHtml = (s.workTypes||[]).map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join('') || '<span class="hint">未設定</span>';
  var mapLink = s.mapUrl ? '<a href="'+esc(s.mapUrl)+'" target="_blank" rel="noopener">Googleマップで開く</a>' : '未設定';

  var pairsHtml = (s.pairs||[]).map(function(p){
    var beforeHtml = p.before
      ? '<img src="'+imgUrl(p.before.objectKey)+'" alt="Before">'
      : (viewMode ? '<div class="slot-empty">&nbsp;</div>' : '<div class="slot-empty">未撮影</div>');
    var afterHtml = p.after
      ? '<img src="'+imgUrl(p.after.objectKey)+'" alt="After">'
      : (viewMode ? '<div class="slot-empty">&nbsp;</div>' : '<div class="slot-empty">未撮影</div>');
    return '' +
      '<div class="pair-row">' +
        '<div class="pair-head"><span>撮影箇所 '+String(p.index).padStart(2,'0')+'</span></div>' +
        '<div class="pair-body">' +
          '<div class="photo-slot"><div class="slot-label before">Before</div><div class="slot-img-wrap">'+beforeHtml+'</div></div>' +
          '<div class="photo-slot"><div class="slot-label after">After</div><div class="slot-img-wrap">'+afterHtml+'</div></div>' +
        '</div>' +
      '</div>';
  }).join('');

  var adminActions = viewMode ? '' : ('' +
    '<div class="btn-row" style="margin:14px 0;">' +
      '<button class="btn btn-primary" data-action="goto-record" data-id="'+s.id+'">'+(s.status==='in_progress' ? '続きから記録' : '編集する')+'</button>' +
      '<button class="btn btn-outline" data-action="toggle-complete" data-id="'+s.id+'">'+(s.status==='completed' ? '施工中に戻す' : 'この現場を施工完了にする')+'</button>' +
    '</div>' +
    '<div class="btn-row" style="margin-bottom:14px;">' +
      '<button class="btn btn-outline btn-sm" data-action="goto-detail" data-id="'+s.id+'" data-view="1">閲覧モードで表示（取引先向け）</button>' +
    '</div>' +
    '<div class="btn-row" style="margin-bottom:14px;">' +
      '<button class="btn btn-danger btn-sm" data-action="delete-site" data-id="'+s.id+'" data-name="'+esc(s.name)+'">この現場の記録を削除する</button>' +
    '</div>'
  );

  document.getElementById('detailContent').innerHTML = '' +
    '<div class="detail-header">' +
      '<h1>'+esc(s.name)+'</h1>' +
      '<span class="status-badge '+s.status+'">'+statusLabel(s.status)+'</span>' +
    '</div>' +
    '<dl class="info-grid">' +
      '<dt>所在地</dt><dd>'+esc(s.address||'未設定')+'</dd>' +
      '<dt>地図</dt><dd>'+mapLink+'</dd>' +
      '<dt>作業日</dt><dd>'+esc(formatWorkDate(s))+'</dd>' +
      '<dt>作業内容</dt><dd class="chips-inline">'+typesHtml+'</dd>' +
      '<dt>撮影状況</dt><dd>'+s.completedPairs+' / '+s.pairCount+' 組完了</dd>' +
      (s.status==='completed' && completionReferenceDate(s) ? '<dt>経過日数</dt><dd>施工完了から '+daysSince(completionReferenceDate(s))+' 日経過</dd>' : '') +
    '</dl>' +
    (s.notes ? '<div class="notes-box">'+esc(s.notes)+'</div>' : '') +
    adminActions +
    '<div class="section-title">Before / After 写真</div>' +
    (pairsHtml || '<div class="empty-note">写真はまだ登録されていません</div>');
}

// ---------------- global click delegation ----------------
document.addEventListener('click', function(e){
  var btn = e.target.closest('[data-action]');
  if(!btn) return;
  var action = btn.dataset.action;

  if(action==='nav'){ navigate('/' + btn.dataset.target); return; }
  if(action==='goto-record'){ navigate('/record/' + btn.dataset.id); return; }
  if(action==='goto-detail'){
    navigate('/detail/' + btn.dataset.id + (btn.dataset.view ? '/view' : ''));
    return;
  }
  if(action==='set-list-mode'){
    state.listMode = btn.dataset.mode;
    initListScreen();
    return;
  }
  if(action==='set-filter'){
    state.listFilter = btn.dataset.filter;
    initListScreen();
    return;
  }
  if(action==='set-date-mode'){ setDateMode(btn.dataset.mode); return; }
  if(action==='toggle-worktype'){
    var t = btn.dataset.type;
    var idx = state.editing.workTypes.indexOf(t);
    if(idx===-1) state.editing.workTypes.push(t); else state.editing.workTypes.splice(idx,1);
    renderWorkTypePresets(); renderWorkTypesList();
    return;
  }
  if(action==='remove-worktype'){
    var idx2 = state.editing.workTypes.indexOf(btn.dataset.type);
    if(idx2!==-1) state.editing.workTypes.splice(idx2,1);
    renderWorkTypePresets(); renderWorkTypesList();
    return;
  }
  if(action==='add-custom-worktype'){
    var input = document.getElementById('fCustomWorkType');
    var v = input.value.trim();
    if(v && state.editing.workTypes.indexOf(v)===-1){ state.editing.workTypes.push(v); }
    input.value = '';
    renderWorkTypePresets(); renderWorkTypesList();
    return;
  }
  if(action==='add-workday'){
    var dInput = document.getElementById('fNewWorkDay');
    var dv = dInput.value;
    if(dv && state.editing.workDays.indexOf(dv)===-1){ state.editing.workDays.push(dv); }
    renderWorkDaysList();
    return;
  }
  if(action==='remove-workday'){
    var di = state.editing.workDays.indexOf(btn.dataset.date);
    if(di!==-1) state.editing.workDays.splice(di,1);
    renderWorkDaysList();
    return;
  }
  if(action==='resolve-map'){
    var raw = document.getElementById('fMapUrl').value.trim();
    var statusEl = document.getElementById('mapResolveStatus');
    if(!raw){ statusEl.innerHTML = '<span class="ng">URLまたは座標を入力してください</span>'; return; }
    statusEl.innerHTML = '<span class="hint">取得中...</span>';
    apiSend('/api/resolve-map-url', 'POST', { input: raw }).then(function(d){
      state.editing.lat = d.lat; state.editing.lng = d.lng;
      if(d.resolvedUrl) document.getElementById('fMapUrl').value = d.resolvedUrl;
      statusEl.innerHTML = '<span class="ok">位置情報を取得しました（'+d.lat.toFixed(5)+', '+d.lng.toFixed(5)+'）</span>';
    }).catch(function(){
      statusEl.innerHTML = '<span class="ng">位置情報を取得できませんでした。手入力の座標か有効なURLを確認してください</span>';
    });
    return;
  }
  if(action==='delete-photo'){
    if(!confirm('この写真を削除しますか？')) return;
    var pIdx = btn.dataset.pair, pSide = btn.dataset.side;
    apiDelete('/api/sites/'+state.editing.id+'/photo?pairIndex='+pIdx+'&side='+pSide).then(function(d){
      state.editing = d.site;
      renderPhotoGrid();
      toast('写真を削除しました');
    }).catch(function(e){ toast('写真の削除に失敗しました: '+e.message, true); });
    return;
  }
  if(action==='toggle-complete'){
    apiSend('/api/sites/'+btn.dataset.id+'/complete', 'POST', {}).then(function(d){
      state.sitesLoaded = false;
      renderDetail(d.site, false);
      toast(d.site.status==='completed' ? '施工完了にしました' : '施工中に戻しました');
    }).catch(function(e){ toast('ステータスの更新に失敗しました: '+e.message, true); });
    return;
  }
  if(action==='delete-site'){
    if(!confirm('「'+btn.dataset.name+'」の記録を削除します。写真も含めて元に戻せません。よろしいですか？')) return;
    apiDelete('/api/sites/'+btn.dataset.id).then(function(){
      state.sitesLoaded = false;
      toast('現場の記録を削除しました');
      navigate('/list');
    }).catch(function(e){ toast('削除に失敗しました: '+e.message, true); });
    return;
  }
  if(action==='bulk-pick'){
    state.bulkMode = btn.dataset.mode;
    document.getElementById('bulkFileInput').click();
    return;
  }
  if(action==='bulk-toggle-side'){
    var idx = parseInt(btn.dataset.index, 10);
    if(state.bulkFiles && state.bulkFiles[idx]) state.bulkFiles[idx].side = btn.dataset.side;
    renderBulkReview();
    return;
  }
  if(action==='bulk-confirm'){
    confirmBulkReview();
    return;
  }
  if(action==='bulk-cancel'){
    clearBulkReview();
    return;
  }
});

document.getElementById('siteForm').addEventListener('submit', function(e){
  e.preventDefault();
  saveSiteForm();
});

window.addEventListener('resize', function(){
  if(state.desktopMap) state.desktopMap.invalidateSize();
  if(state.map) state.map.invalidateSize();
});

// ---------------- mobile hamburger menu ----------------
document.getElementById('bulkFileInput').addEventListener('change', function(){
  var files = Array.prototype.slice.call(this.files || []);
  this.value = '';
  if(!files.length) return;

  if(state.bulkMode === 'separate-before'){
    bulkUploadSequential(files, 'before');
  } else if(state.bulkMode === 'separate-after'){
    bulkUploadSequential(files, 'after');
  } else if(state.bulkMode === 'mixed'){
    state.bulkFiles = files.map(function(file, i){
      return { file: file, url: URL.createObjectURL(file), side: i % 2 === 0 ? 'before' : 'after' };
    });
    renderBulkReview();
  }
});

document.getElementById('menuToggle').addEventListener('click', function(e){
  e.stopPropagation();
  document.getElementById('mobileMenu').classList.toggle('open');
});
document.addEventListener('click', function(e){
  var menu = document.getElementById('mobileMenu');
  if(!menu.classList.contains('open')) return;
  if(menu.contains(e.target) || e.target === document.getElementById('menuToggle')) return;
  menu.classList.remove('open');
});

// ---------------- boot ----------------
if(!location.hash) location.hash = '/';
route();

})();
</script>
